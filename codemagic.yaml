workflows:
  ios-appstore-cloud-release:
    name: Apex Snowboard 3D — Publication App Store Connect (Sans Xcode local)
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Codemagic_AppStore_Key
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.apexsnowboard.game
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.apexsnowboard.game"
      node: 22
      xcode: latest
    scripts:
      - name: Extraction automatique du projet iOS autonome et synchronisation WebGL
        script: |
          if [ ! -f "package.json" ]; then
            echo "Extraction du projet iOS autonome intégré dans codemagic.yaml..."
            node -e 'const fs=require("fs"),zlib=require("zlib");const y=fs.readFileSync("codemagic.yaml","utf8");const b64=y.split("\n").filter(l=>l.startsWith("#APEX_B64:")).map(l=>l.slice(10)).join("");fs.writeFileSync("/tmp/apex.tar",zlib.brotliDecompressSync(Buffer.from(b64,"base64")));'
            tar -xf /tmp/apex.tar
            rm -f /tmp/apex.tar
            cp public/icons/icon-1024.png ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png
            cp public/icons/icon-1024.png public/icons/icon-512.png
            cp public/icons/icon-1024.png public/icons/apple-touch-icon.png
            cp public/icons/icon-1024.png ios/App/App/Assets.xcassets/Splash.imageset/splash-2732x2732.png
            cp public/icons/icon-1024.png ios/App/App/Assets.xcassets/Splash.imageset/splash-2732x2732-1.png
            cp public/icons/icon-1024.png ios/App/App/Assets.xcassets/Splash.imageset/splash-2732x2732-2.png
          fi
          npm install
          npm run ios:sync
      - name: Configuration automatique des profils de signature Apple (Cloud)
        script: |
          xcode-project use-profiles --project "$XCODE_PROJECT"
      - name: Incrémentation automatique du numéro de build App Store Connect
        script: |
          cd ios/App
          LATEST_BUILD=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" || echo 0)
          agvtool new-version -all $((LATEST_BUILD + 1))
      - name: Compilation de l'archive iOS (.ipa) avec la dernière version de Xcode Cloud
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false

