workflows:
  ios-appstore-cloud-release:
    name: Apex Snowboard 3D — Compilation Xcode Cloud & App Store (.ipa)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        - app_store
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.apexsnowboard.game"
      xcode: latest
    scripts:
      - name: 1. Extraction du projet Xcode pre-compile (Zero dependance npm)
        script: |
          export PATH="/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin:$PATH"
          if [ ! -d "ios/App/App.xcodeproj" ]; then
            /usr/bin/sed -n "s/^[[:space:]]*#APEX_B64://p" codemagic.yaml | /usr/bin/tr -d " \t\r" | /usr/bin/base64 --decode > /tmp/apex_ios.tar.gz
            /usr/bin/tar -xzf /tmp/apex_ios.tar.gz
            /bin/rm -f /tmp/apex_ios.tar.gz
            ICON_SRC="ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png"
            /bin/cp "$ICON_SRC" ios/App/App/public/icons/icon-1024.png
            /bin/cp "$ICON_SRC" ios/App/App/public/icons/icon-512.png
            /bin/cp "$ICON_SRC" ios/App/App/public/icons/apple-touch-icon.png
            /bin/cp "$ICON_SRC" ios/App/App/Assets.xcassets/Splash.imageset/splash-2732x2732.png
            /bin/cp "$ICON_SRC" ios/App/App/Assets.xcassets/Splash.imageset/splash-2732x2732-1.png
            /bin/cp "$ICON_SRC" ios/App/App/Assets.xcassets/Splash.imageset/splash-2732x2732-2.png
          fi
          /bin/ls -la ios/App/App.xcodeproj ios/App/App/public
      - name: 2. Creation du profil Apple (embedded.mobileprovision) et signature de ApexSnowboard3D.ipa
        script: |
          export PATH="/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin:$PATH"
          /bin/mkdir -p build/ios/ipa
          keychain initialize
          if [ -z "$CERTIFICATE_PRIVATE_KEY" ]; then
            /usr/bin/openssl genrsa -out /tmp/cert_key.pem 2048
          else
            printf "%s\n" "$CERTIFICATE_PRIVATE_KEY" > /tmp/cert_key.pem
          fi
          /usr/bin/python3 - << 'PYEOF'
          import os, re, sys

          uuid_re = re.compile(r'[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}')
          keyid_re = re.compile(r'(?:AuthKey_)?([A-Z0-9]{10})(?:\.p8)?')

          issuer = os.environ.get('APP_STORE_CONNECT_ISSUER_ID', '').strip()
          key_id = os.environ.get('APP_STORE_CONNECT_KEY_IDENTIFIER', '').strip()
          raw_pk = os.environ.get('APP_STORE_CONNECT_PRIVATE_KEY', '').strip()

          for k, v in os.environ.items():
              val = v.strip()
              if not issuer and uuid_re.search(val) and 'KEY' not in val:
                  issuer = uuid_re.search(val).group(0)
              if not raw_pk and ('BEGIN PRIVATE KEY' in val or val.startswith('MIG')):
                  raw_pk = val
          if uuid_re.search(key_id) and not uuid_re.search(issuer):
              issuer, key_id = key_id, issuer
          if uuid_re.search(issuer):
              issuer = uuid_re.search(issuer).group(0)
          m_kid = keyid_re.search(key_id)
          if m_kid:
              key_id = m_kid.group(1)
          else:
              for k, v in os.environ.items():
                  if any(w in k.upper() for w in ['KEY', 'ASC', 'APP_STORE']):
                      m2 = keyid_re.search(v.strip())
                      if m2 and 'BEGIN' not in v:
                          key_id = m2.group(1)
                          break

          body = re.sub(r'-----BEGIN [A-Z ]+-----', '', raw_pk)
          body = re.sub(r'-----END [A-Z ]+-----', '', body)
          body = re.sub(r'\s+', '', body)
          lines = [body[i:i+64] for i in range(0, len(body), 64)]
          pem = "-----BEGIN PRIVATE KEY-----\n" + "\n".join(lines) + "\n-----END PRIVATE KEY-----\n"

          print(f"Diagnostic Apple API -> ISSUER_ID: {'OK ('+issuer[:8]+'...)' if issuer else 'MANQUANT'}")
          print(f"Diagnostic Apple API -> KEY_ID: {'OK ('+key_id+')' if key_id else 'MANQUANT'}")
          print(f"Diagnostic Apple API -> PRIVATE_KEY (.p8): {'OK ('+str(len(body))+' chars base64)' if len(body) > 60 else 'MANQUANT OU INVALIDE ('+str(len(body))+' chars)'}")

          if not issuer or not key_id or len(body) < 60:
              print("ERREUR: Verifiez vos 3 variables dans l'onglet Environment variables (groupe app_store) de Codemagic.")
              sys.exit(1)

          with open('/tmp/AuthKey.p8', 'w') as f:
              f.write(pem)
          with open('/tmp/asc_env.sh', 'w') as f:
              f.write(f'export CLEAN_ISSUER_ID="{issuer}"\n')
              f.write(f'export CLEAN_KEY_ID="{key_id}"\n')
          PYEOF
          source /tmp/asc_env.sh
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --issuer-id "$CLEAN_ISSUER_ID" \
            --key-id "$CLEAN_KEY_ID" \
            --private-key "@file:/tmp/AuthKey.p8" \
            --certificate-key "@file:/tmp/cert_key.pem" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles --project "$XCODE_PROJECT"
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
          /bin/ls -lh build/ios/ipa/*.ipa
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
