workflows:
  ios-appstore-cloud-release:
    name: Apex Snowboard 3D — Compilation Xcode Cloud & App Store (.ipa)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.apexsnowboard.game"
      node: 22
      xcode: latest
    scripts:
      - name: 1. Extraction automatique du projet iOS autonome et synchronisation WebGL
        script: |
          if [ ! -f "package.json" ]; then
            echo "Extraction du projet iOS autonome intégré dans codemagic.yaml..."
            node -e 'const fs=require("fs"),zlib=require("zlib");const y=fs.readFileSync("codemagic.yaml","utf8");const b64=y.split("\n").filter(l=>l.startsWith("#APEX_B64:")).map(l=>l.slice(10)).join("");fs.writeFileSync("/tmp/apex.tar",zlib.brotliDecompressSync(Buffer.from(b64,"base64")));'
            tar -xf /tmp/apex.tar
            rm -f /tmp/apex.tar
            cp public/icons/icon-1024.png ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png
            cp public/icons/icon-1024.png public/icons/icon-512.png
            cp public/icons/icon-1024.png public/icons/apple-touch-icon.png
            cp public/icons/icon-1024.png ios/App/App/Assets.xcassets/Splash.imageset/splash-2732x2732.png
            cp public/icons/icon-1024.png ios/App/App/Assets.xcassets/Splash.imageset/splash-2732x2732-1.png
            cp public/icons/icon-1024.png ios/App/App/Assets.xcassets/Splash.imageset/splash-2732x2732-2.png
          fi
          npm install
          npm run ios:sync
      - name: 2. Signature Apple Automatique (--create) ou Compilation directe de ApexSnowboard3D.ipa
        script: |
          mkdir -p build/ios/ipa
          SIGNED_OK=0
          if [ -n "$APP_STORE_CONNECT_KEY_IDENTIFIER" ] && [ -n "$APP_STORE_CONNECT_ISSUER_ID" ] && [ -n "$APP_STORE_CONNECT_PRIVATE_KEY" ]; then
            echo "Clé Apple Developer détectée : Création automatique du profil App Store (--create)..."
            keychain initialize
            if app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create; then
              keychain add-certificates
              xcode-project use-profiles --project "$XCODE_PROJECT"
              xcode-project build-ipa --project "$XCODE_PROJECT" --scheme "$XCODE_SCHEME"
              SIGNED_OK=1
              app-store-connect publish --path build/ios/ipa/*.ipa || true
            fi
          fi
          if [ "$SIGNED_OK" -eq 0 ]; then
            echo "Compilation Xcode 16 Cloud directe du paquet iOS (ApexSnowboard3D.ipa)..."
            xcodebuild -project "$XCODE_PROJECT" \
              -scheme "$XCODE_SCHEME" \
              -configuration Release \
              -sdk iphoneos \
              -derivedDataPath build/DerivedData \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO \
              clean build
            mkdir -p build/Payload
            cp -r build/DerivedData/Build/Products/Release-iphoneos/App.app build/Payload/
            cd build && zip -r -q ios/ipa/ApexSnowboard3D.ipa Payload && rm -rf Payload
            echo "✅ Paquet iOS compilé avec succès : build/ios/ipa/ApexSnowboard3D.ipa"
          fi
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

